<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Gold Ribbon & Star Gradient -->
    <linearGradient id="goldGrad" x1="18" y1="20" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Inner Shield Glow -->
    <linearGradient id="innerGlow" x1="32" y1="10" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="2" y="2" width="60" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Main Outer Shield with Shadow -->
  <path d="M32 4L10 12V28C10 42.4 19.4 55.4 32 60C44.6 55.4 54 42.4 54 28V12L32 4Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Inner Ornate Shield Border -->
  <path d="M32 8L14 14.5V28C14 40.2 21.7 51.5 32 55.5C42.3 51.5 50 40.2 50 28V14.5L32 8Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.8" 
        stroke-linecap="round" />

  <!-- Subtle Top Highlight -->
  <path d="M32 9L15 15.2V28C15 30 15.2 32 15.6 34C20 28 26 23 32 23C38 23 44 28 48.4 34C48.8 32 49 30 49 28V15.2L32 9Z" 
        fill="url(#innerGlow)" />

  <!-- Certificate Parchment / Scroll Centerpiece -->
  <rect x="22" y="19" width="20" height="24" rx="2.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Certificate Document Lines -->
  <line x1="26" y1="24" x2="38" y2="24" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round" />
  <line x1="26" y1="28" x2="35" y2="28" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="26" y1="32" x2="37" y2="32" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Gold Embossed Medallion / Seal with Ribbons -->
  <circle cx="32" cy="38" r="4.5" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1" />
  <path d="M30 41.5L28.5 48L32 46.5L35.5 48L34 41.5" fill="url(#goldGrad)" />

  <!-- Verified Checkmark in Seal -->
  <path d="M30.2 38L31.4 39.2L33.8 36.8" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
